version: '3.9'

services:

  api:
    build: .
    container_name: workflow_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    env_file:
      - .env

  postgres:
    image: postgres:15
    container_name: workflow_postgres
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: workflow_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: workflow_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  celery_worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      - rabbitmq
      - redis

  celery_beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      - rabbitmq
      - rediss